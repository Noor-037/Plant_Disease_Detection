<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Plant Disease Detector</h2>
    <p class="subtitle">AI-powered disease detection & pesticide recommendation</p>

    <div class="card">
        <label for="plant_type">Plant Type <span class="optional-tag">(optional - leave as "Not specified" if unsure)</span></label>
        <select id="plant_type">
            <option value="">Not specified</option>
            <option>Tomato</option>
            <option>Wheat</option>
            <option>Cotton</option>
            <option>Rice</option>
        </select>

        <div style="margin-top: 15px;">
            <video id="webcam" autoplay playsinline style="width: 100%; max-width: 500px; border-radius: 8px; border: 1px solid #ccc;"></video>
        </div>

        <div id="result" style="margin-top: 15px; font-weight: bold; font-size: 1.1em; color: #2e7d32;">
            Initializing auto-scanner...
        </div>
    </div>

    <script>
      let video = document.getElementById('webcam');

      async function startAutoScan() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          video.srcObject = stream;
          setInterval(captureAndScan, 1500);
        } catch (err) {
          console.error("Camera access denied:", err);
          document.getElementById('result').innerText = "Camera access denied or not available.";
        }
      }

      function captureAndScan() {
        if (!video.videoWidth) return;
        
        let canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          let formData = new FormData();
          formData.append('image', blob, 'frame.jpg');

          let plantType = document.getElementById('plant_type').value;
          if (plantType) {
            formData.append('plant_type', plantType);
          }

          fetch('/api/scan', {
            method: 'POST',
            body: formData
          })
          .then(res => res.json())
          .then(data => {
            if (data.is_leaf) {
              document.getElementById('result').innerText = `Disease: ${data.disease} (${(data.confidence * 100).toFixed(1)}%)`;
            } else {
              document.getElementById('result').innerText = "Scanning... Bring a plant leaf into focus.";
            }
          })
          .catch(err => console.error("Scan error:", err));
        }, 'image/jpeg');
      }

      window.onload = startAutoScan;
    </script>
</body>
</html>
