<script>
  let video = document.getElementById('webcam');
  let scanInterval = null;

  async function startAutoScan() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      
      // Auto-captures frame every 1.5 seconds automatically
      scanInterval = setInterval(captureAndScan, 1500);
    } catch (err) {
      console.error("Camera access denied:", err);
    }
  }

  function captureAndScan() {
    let canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    let ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
      let formData = new FormData();
      formData.append('image', blob, 'frame.jpg');

      fetch('/api/scan', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.is_leaf) {
          document.getElementById('result').innerText = `Disease: ${data.disease} (${(data.confidence * 100).toFixed(1)}%)`;
        } else {
          document.getElementById('result').innerText = "Scanning... Bring a plant leaf into focus.";
        }
      })
      .catch(err => console.error("Scan error:", err));
    }, 'image/jpeg');
  }

  window.onload = startAutoScan;
</script>
